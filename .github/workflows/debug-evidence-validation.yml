name: Debug evidence validation

on:
  push:
    branches: [codex/debug-evidence]
    paths: [.github/workflows/debug-evidence-validation.yml]

permissions:
  contents: read

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Prepare offline plugin build inputs
        run: |
          bun install --cwd plugins --frozen-lockfile
          mkdir "$RUNNER_TEMP/plugin-inputs"
          cp "$(command -v bun)" "$RUNNER_TEMP/plugin-inputs/bun"
          cp -a plugins/node_modules "$RUNNER_TEMP/plugin-inputs/node_modules"
          tar -czf "$RUNNER_TEMP/plugin-inputs.tar.gz" -C "$RUNNER_TEMP/plugin-inputs" .
      - uses: actions/upload-artifact@v4
        with:
          name: mekugi-plugin-inputs
          path: ${{ runner.temp }}/plugin-inputs.tar.gz
          retention-days: 1
          compression-level: 0
