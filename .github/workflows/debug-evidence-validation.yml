name: Debug evidence validation

on:
  push:
    branches: [codex/debug-evidence]
    paths: [.github/workflows/debug-evidence-validation.yml]

permissions:
  contents: read

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked source for offline validation
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/mekugi-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: mekugi-source
          path: ${{ runner.temp }}/mekugi-source.tar.gz
          retention-days: 1
