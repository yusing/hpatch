name: Debug evidence validation

on:
  push:
    branches: [codex/debug-evidence]
    paths: [.github/workflows/debug-evidence-validation.yml]

permissions:
  contents: read

jobs:
  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Export supported runtime
        run: |
          mkdir "$RUNNER_TEMP/node-inputs"
          cp "$(command -v node)" "$RUNNER_TEMP/node-inputs/node"
          tar -czf "$RUNNER_TEMP/node-inputs.tar.gz" -C "$RUNNER_TEMP/node-inputs" .
      - uses: actions/upload-artifact@v4
        with:
          name: mekugi-node-inputs
          path: ${{ runner.temp }}/node-inputs.tar.gz
          retention-days: 1
          compression-level: 0
