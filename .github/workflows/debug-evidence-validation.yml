name: Debug evidence validation

on:
  push:
    branches: [codex/debug-evidence]
    paths: [.github/workflows/debug-evidence-validation.yml]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7fd171a1a39eb5678f5d9dd125487e4212f8e557
          persist-credentials: false
      - run: git archive --format=tar.gz --output="$RUNNER_TEMP/pr23-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pr23-source
          path: ${{ runner.temp }}/pr23-source.tar.gz
          retention-days: 1
