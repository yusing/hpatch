name: ${COMPOSE_PROJECT_NAME:-hpatch-bench}

x-bench-image: &bench-image
  image: hpatch-bench:${HPATCH_BENCH_IMAGE_TAG:-local}

x-agent: &agent
  <<: *bench-image
  profiles: [agent]
  read_only: true
  cap_add: [NET_ADMIN, SYS_ADMIN]
  # Docker AppArmor blocks the trusted launcher from creating private mounts.
  # The executor instead has no capabilities, immutable groups and read-only mounts.
  security_opt: [no-new-privileges:true, apparmor:unconfined]
  tmpfs: [/tmp, /root/.codex]
  environment:
    GOPROXY: "off"
    GOSUMDB: "off"
    GOTOOLCHAIN: "local"
    GOVCS: "*:off"
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONPYCACHEPREFIX: /tmp/hpatch-benchmark-pycache
    HPATCH_BENCH_ISSUE_DIR: /benchmark-agent-issue-reports
    HPATCH_DIAGNOSE: ${HPATCH_BENCH_DIAGNOSE:-0}
  labels:
    hpatch.benchmark.role: agent
  volumes:
    - ${BENCH_RUN_DIR:?}/instructions:/bench-instructions:ro
    - ${BENCH_RUN_DIR:?}/hpatch-config:/root/.config:ro
    - ${BENCH_RUN_DIR:?}/agent-issue-reports:/benchmark-agent-issue-reports
    - ${BENCH_DEPENDENCY_CACHE:?}:/go/pkg/mod:ro
    - ${BENCH_DEPENDENCY_CACHE:?}:${BENCH_DEPENDENCY_CACHE:?}:ro
    - ${CODEX_AUTH_PATH:?}:/root/.codex/auth.json:ro

services:
  dependency-loader:
    <<: *bench-image
    build:
      context: ..
      dockerfile: benchmarks/Dockerfile
    profiles: [setup]
    environment:
      GOSUMDB: "off"
      GOTOOLCHAIN: local
    networks:
      egress: {}
    volumes:
      - ${BENCH_DEPENDENCY_CACHE:?}:/go/pkg/mod

  control-agent:
    <<: *agent
    networks:
      control-egress: {}

  hpatch-agent:
    <<: *agent
    networks:
      hpatch-egress: {}

networks:
  control-egress: {}
  hpatch-egress: {}
  egress: {}
