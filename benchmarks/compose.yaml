name: ${COMPOSE_PROJECT_NAME:-mekugi-bench}

x-bench-image: &bench-image
  image: ${BENCH_IMAGE:-mekugi-bench:${MEKUGI_BENCH_IMAGE_TAG:-local}}

x-agent: &agent
  <<: *bench-image
  profiles: [agent]
  read_only: true
  cap_add: [NET_ADMIN, SYS_ADMIN]
  # Docker AppArmor blocks the trusted launcher from creating private mounts.
  # The executor instead has no capabilities, immutable groups and read-only mounts.
  security_opt: [no-new-privileges:true, apparmor:unconfined]
  tmpfs: [/tmp, /root/.codex]
  environment:
    GOPROXY: "off"
    GOSUMDB: "off"
    GOTOOLCHAIN: "local"
    GOVCS: "*:off"
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONPYCACHEPREFIX: /tmp/mekugi-benchmark-pycache
    MEKUGI_BENCH_ISSUE_DIR: /benchmark-agent-issue-reports
    MEKUGI_DIAGNOSE: ${MEKUGI_BENCH_DIAGNOSE:-0}
  labels:
    mekugi.benchmark.role: agent
  volumes:
    - ${BENCH_RUN_DIR:?}/instructions:/bench-instructions:ro
    - ${BENCH_RUN_DIR:?}/mekugi-config:/root/.config:ro
    - ${BENCH_RUN_DIR:?}/agent-issue-reports:/benchmark-agent-issue-reports
    - ${BENCH_DEPENDENCY_CACHE:?}:/go/pkg/mod:ro
    - ${BENCH_DEPENDENCY_CACHE:?}:${BENCH_DEPENDENCY_CACHE:?}:ro
    - ${CODEX_AUTH_PATH:?}:/root/.codex/auth.json:ro

services:
  dependency-loader:
    <<: *bench-image
    build:
      context: ${BENCH_BUILD_CONTEXT:-..}
      dockerfile: benchmarks/Dockerfile
    profiles: [setup]
    environment:
      GOSUMDB: "off"
      GOTOOLCHAIN: local
      GOCACHE: /tmp/go-build
    networks:
      egress: {}
    volumes:
      - ${BENCH_DEPENDENCY_CACHE:?}:/go/pkg/mod

  grader:
    <<: *bench-image
    profiles: [grading]
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 512
    mem_limit: 8g
    tmpfs: ["/tmp:exec,size=4g,mode=1777"]
    environment:
      HOME: /tmp
      GOMODCACHE: /go/pkg/mod
      GOCACHE: /tmp/go-build
      GOPROXY: "off"
      GOSUMDB: "off"
      GOTOOLCHAIN: local
      GOVCS: "*:off"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ${BENCH_DEPENDENCY_CACHE:?}:/go/pkg/mod:ro
      - ${BENCH_DEPENDENCY_CACHE:?}:${BENCH_DEPENDENCY_CACHE:?}:ro

  control-agent:
    <<: *agent
    networks:
      control-egress: {}

  mekugi-agent:
    <<: *agent
    networks:
      mekugi-egress: {}

networks:
  control-egress: {}
  mekugi-egress: {}
  egress: {}
