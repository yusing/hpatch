name: ${COMPOSE_PROJECT_NAME:-hpatch-bench}

x-bench-image: &bench-image
  image: hpatch-bench:${HPATCH_BENCH_IMAGE_TAG:-local}

x-agent: &agent
  <<: *bench-image
  profiles: [agent]
  environment:
    GOPROXY: "off"
    GOSUMDB: "off"
    GOTOOLCHAIN: "local"
    GOVCS: "*:off"
    HPATCH_RUNTIME_DIR: ${BENCH_RUN_DIR:?BENCH_RUN_DIR must be set}/hpatch-runtime
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONPYCACHEPREFIX: "/tmp/hpatch-benchmark-pycache"
  labels:
    hpatch.benchmark.role: agent
  volumes:
    - type: bind
      source: ${BENCH_RUN_DIR:?BENCH_RUN_DIR must be set}/instructions
      target: /bench-instructions
      read_only: true
    - type: bind
      source: ${BENCH_RUN_DIR:?BENCH_RUN_DIR must be set}/hpatch-runtime
      target: ${BENCH_RUN_DIR:?BENCH_RUN_DIR must be set}/hpatch-runtime
      read_only: true
    - type: bind
      source: ${BENCH_DEPENDENCY_CACHE:?BENCH_DEPENDENCY_CACHE must be set}
      target: /go/pkg/mod
      read_only: true
    - type: bind
      source: ${BENCH_DEPENDENCY_CACHE:?BENCH_DEPENDENCY_CACHE must be set}
      target: ${BENCH_DEPENDENCY_CACHE:?BENCH_DEPENDENCY_CACHE must be set}
      read_only: true
    - type: bind
      source: ${CODEX_AUTH_PATH:?CODEX_AUTH_PATH must be set}
      target: /root/.codex/auth.json
      read_only: true

services:
  control:
    build:
      context: ..
      dockerfile: benchmarks/Dockerfile
    <<: *bench-image
    command:
      - hpatch-router
      - --listen
      - 0.0.0.0:8081
      - --mode
      - passthrough
    networks:
      control-agent: {}
      egress:
        gw_priority: 1
    volumes:
      - type: bind
        source: ${BENCH_RUN_DIR:?BENCH_RUN_DIR must be set}/work
        target: ${BENCH_RUN_DIR:?BENCH_RUN_DIR must be set}/work
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8081/api/metrics]
      interval: 250ms
      timeout: 1s
      retries: 40

  hpatch:
    <<: *bench-image
    environment:
      HPATCH_BENCH_ISSUE_DIR: /benchmark-agent-issue-reports
      HPATCH_BENCH_EXACT_EVIDENCE_DIR: ${HPATCH_BENCH_EXACT_EVIDENCE_DIR:-}
      HPATCH_DIAGNOSE: ${HPATCH_BENCH_DIAGNOSE:-0}
      HPATCH_RUNTIME_DIR: ${BENCH_RUN_DIR:?BENCH_RUN_DIR must be set}/hpatch-runtime
      TMPDIR: ${BENCH_RUN_DIR:?BENCH_RUN_DIR must be set}/hpatch-runtime
    command:
      - hpatch-router
      - --listen
      - 0.0.0.0:8082
      - --mode
      - hpatch
    networks:
      hpatch-agent: {}
      egress:
        gw_priority: 1
    volumes:
      - type: bind
        source: ${BENCH_RUN_DIR:?BENCH_RUN_DIR must be set}/work
        target: ${BENCH_RUN_DIR:?BENCH_RUN_DIR must be set}/work
      - type: bind
        source: ${BENCH_RUN_DIR:?BENCH_RUN_DIR must be set}/hpatch-config
        target: /root/.config
      - type: bind
        source: ${BENCH_RUN_DIR:?BENCH_RUN_DIR must be set}/hpatch-runtime
        target: ${BENCH_RUN_DIR:?BENCH_RUN_DIR must be set}/hpatch-runtime
      - type: bind
        source: ${BENCH_RUN_DIR:?BENCH_RUN_DIR must be set}/agent-issue-reports
        target: /benchmark-agent-issue-reports
      - type: bind
        source: ${BENCH_RUN_DIR:?BENCH_RUN_DIR must be set}/hpatch-exact-evidence
        target: /benchmark-hpatch-exact-evidence
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8082/api/metrics]
      interval: 250ms
      timeout: 1s
      retries: 40

  dependency-loader:
    <<: *bench-image
    profiles: [setup]
    environment:
      GOSUMDB: "off"
      GOTOOLCHAIN: local
    networks:
      egress: {}
    volumes:
      - type: bind
        source: ${BENCH_DEPENDENCY_CACHE:?BENCH_DEPENDENCY_CACHE must be set}
        target: /go/pkg/mod

  control-agent:
    <<: *agent
    networks:
      control-agent: {}

  hpatch-agent:
    <<: *agent
    networks:
      hpatch-agent: {}

networks:
  control-agent:
    internal: true
  hpatch-agent:
    internal: true
  egress: {}
